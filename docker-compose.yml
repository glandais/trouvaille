services:
  # Reverse proxy
  traefik:
    image: traefik:v3.7
    restart: unless-stopped
    networks:
      - trouvaille
    command:
      - "--api.dashboard=false"           # Disable dashboard in production
#      - "--api.dashboard=true"
#      - "--api.insecure=true"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
      - "--log.level=WARN"               # Reduce log verbosity
#      - "--log.level=DEBUG"
      - "--accesslog=true"
      - "--accesslog.filepath=/var/log/traefik/access.log"
      - "--providers.docker.constraints=Label(`traefik.stack`,`${TRAEFIK_STACK}`)"
    ports:
      - "${HTTP_PORT:-8090}:80"        # HTTP configurable (default 8090)
#      - "127.0.0.1:${TRAEFIK_DASHBOARD_HTTP_PORT:-28080}:8080"  # Dashboard (localhost only)
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    labels:
      - "traefik.enable=false"
#      - "traefik.enable=true"
#      - "traefik.stack=${TRAEFIK_STACK}"
#      - "traefik.http.routers.traefik.rule=Host(`traefik.localhost`)"
#      - "traefik.http.routers.traefik.service=api@internal"

  imgproxy:
    image: ghcr.io/imgproxy/imgproxy:v4.0.11
    restart: unless-stopped
    networks:
      - trouvaille
    volumes:
      - "./data/photos:/mnt/data"
    environment:
      IMGPROXY_AUTO_WEBP: "true"
      IMGPROXY_AUTO_AVIF: "true"
      IMGPROXY_AUTO_JXL: "true"
      IMGPROXY_QUALITY: "85"
      IMGPROXY_MAX_SRC_RESOLUTION: "50000000"
      IMGPROXY_LOCAL_FILESYSTEM_ROOT: "/mnt/data"

  varnish:
    image: varnish:9.0.3
    restart: unless-stopped
    networks:
      - trouvaille
    volumes:
      - "./varnish.vcl:/etc/varnish/default.vcl"
    tmpfs:
      - /var/lib/varnish:exec,mode=1777
    environment:
      - VARNISH_SIZE=20G
    command: "-p default_ttl=86400"

  # MongoDB
  mongodb:
    image: mongo:8.2.11
    restart: unless-stopped
    networks:
      - trouvaille
    env_file:
      - .env
    volumes:
      - "./data/mongodb:/data/db"
    ports:
      - "127.0.0.1:${MONGO_HOST_PORT}:27017"    # MongoDB (localhost only)
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 40s
    # Add resource limits
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 512M

  # Backend Quarkus
  backend:
    image: ghcr.io/glandais/trouvaille-backend:latest
    restart: unless-stopped
    networks:
      - trouvaille
    depends_on:
      mongodb:
        condition: service_healthy
    env_file:
      - .env
    volumes:
      - "./data/photos:/opt/trouvaille/data/photos"
      - "./data/keys:/opt/trouvaille/data/keys"
    labels:
      - "traefik.enable=true"
      - "traefik.stack=${TRAEFIK_STACK}"
      - "traefik.http.routers.quarkus.rule=PathPrefix(`/api`)"
      - "traefik.http.routers.quarkus.priority=100"
      - "traefik.http.services.quarkus.loadbalancer.server.port=8080"

  # Frontend Vue.js
  frontend:
    image: ghcr.io/glandais/trouvaille-frontend:latest
    restart: unless-stopped
    networks:
      - trouvaille
    depends_on:
      - backend
    env_file:
      - .env
    labels:
      - "traefik.enable=true"
      - "traefik.stack=${TRAEFIK_STACK}"
      - "traefik.http.routers.frontend.rule=PathPrefix(`/`)"
      - "traefik.http.services.frontend.loadbalancer.server.port=80"
      - "traefik.http.routers.frontend.priority=1"

networks:
  trouvaille:
