# Test configuration for integration tests
quarkus.log.level=INFO
quarkus.log.category."io.github.glandais.trouvaille".level=DEBUG

quarkus.rest-client.oauth2.url=http://localhost:8089
quarkus.rest-client.imgproxy.url=http://localhost:8091

# Test JWT configuration (if needed)
mp.jwt.verify.publickey.location=META-INF/resources/publicKey.pem
smallrye.jwt.sign.key.location=META-INF/resources/privateKey.pem

# Required application properties
trouvaille.base-path=/tmp/test-trouvaille
quarkus.http.cors.origins=http://localhost:3000

trouvaille.front.client-id=client-id
trouvaille.front.authorize-uri=https://auth

trouvaille.bot.channel-id=channelid
trouvaille.bot.token=token
trouvaille.oauth.client-id=client-id
trouvaille.oauth.client-secret=client-secret
